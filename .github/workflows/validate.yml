name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Run tests
        run: python3 scripts/run_tests.py
